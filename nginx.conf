events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout 65;

    # Allow up to 50MB request bodies to support large road linkage graphs (prevents 413 error)
    client_max_body_size 50M;

    upstream backend_api {
        server api:5000;
    }

    server {
        listen 80;
        server_name localhost;

        # Forward all search and application traffic to backend Flask API
        location / {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # Dedicated health check endpoint for reverse proxy
        location /health {
            access_log off;
            return 200 "proxy-healthy\n";
        }
    }
}
